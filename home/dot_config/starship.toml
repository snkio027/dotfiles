# ------------------------------------------------------------------------------
# Quiet Ops Prompt
# 只显示位置、代码状态、显式执行目标与低频高价值反馈。
# ------------------------------------------------------------------------------

"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"
add_newline = false
scan_timeout = 30
command_timeout = 800

# 第一行左侧是位置与 Git 状态，fill 之后是下一条命令的执行目标。
# 第二行只保留输入箭头；右侧仅显示后台任务数与长命令耗时。
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$direnv\
$terraform\
$line_break\
$character"""

right_format = """$jobs$cmd_duration"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](teal)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](mauve)"

# 用户名只在 root、SSH 或身份发生变化时出现。
[username]
style_user = "overlay1"
style_root = "bold red"
format = "[$user]($style) "
show_always = false

[hostname]
ssh_only = true
ssh_symbol = " "
style = "overlay1"
format = "[$ssh_symbol$hostname]($style) "

[directory]
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "~"
style = "sapphire"
before_repo_root_style = "sapphire"
repo_root_style = "bold sapphire"
read_only = " 󰌾"
read_only_style = "bold red"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "overlay2"
format = "[$symbol$branch]($style) "
truncation_length = 24
truncation_symbol = "…"

[git_state]
style = "bold yellow"
format = "[$state( $progress_current/$progress_total)]($style) "

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
ignore_submodules = true
conflicted = "[!${count}](bold red) "
ahead = "[⇡${count}](overlay2) "
behind = "[⇣${count}](overlay2) "
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold red) "
up_to_date = ""
untracked = "?${count} "
stashed = "≡${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "-${count} "
typechanged = "~${count} "

# 健康的 direnv 完全静默，只显示未加载、未授权或拒绝状态。
[direnv]
disabled = false
style = "yellow"
symbol = ""
format = '([󰅖 $loaded( $allowed)]($style) )'
allowed_msg = ""
not_allowed_msg = "allow"
denied_msg = "denied"
loaded_msg = ""
unloaded_msg = "unloaded"

# Terraform 项目只显示 workspace，不执行无关的版本展示。
[terraform]
symbol = " "
style = "teal"
format = "[$symbol$workspace]($style) "

[jobs]
symbol = "✦"
style = "yellow"
format = "[$symbol$number]($style) "
symbol_threshold = 1
number_threshold = 1

[cmd_duration]
min_time = 2000
style = "overlay1"
format = "[$duration]($style)"

# Catppuccin Mocha 官方调色板
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
