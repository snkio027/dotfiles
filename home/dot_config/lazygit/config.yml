gui:
  border: rounded
  filterMode: fuzzy
  nerdFontsVersion: "3"
  showFileIcons: true
  showIcons: true
  showRandomTip: false
  showCommandLog: true
  scrollOffMargin: 4
  splitDiff: auto
  theme:
    activeBorderColor: ["#a6e3a1", bold]
    inactiveBorderColor: ["#6c7086"]
    searchingActiveBorderColor: ["#89b4fa", bold]
    optionsTextColor: ["#cba6f7"]
    selectedLineBgColor: ["#313244"]
    inactiveViewSelectedLineBgColor: ["#181825"]
    cherryPickedCommitFgColor: ["#89b4fa"]
    cherryPickedCommitBgColor: ["#94e2d5"]
    markedBaseCommitFgColor: ["#89b4fa"]
    markedBaseCommitBgColor: ["#f9e2af"]
    unstagedChangesColor: ["#f38ba8"]
    defaultFgColor: ["#cdd6f4"]

git:
  autoFetch: true
  autoRefresh: true
  autoDetectExternalChanges: true
  fetchAll: true
  log:
    order: topo-order
    showGraph: always

update:
  method: never
