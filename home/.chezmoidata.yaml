# ==============================================================================
# .chezmoidata.yaml — 全局静态 chezmoi 数据字典
# Git 默认值与功能开关
# ==============================================================================

# 全局 Git 默认行为
git:
  default_branch: "main"
  gpg_format: "ssh"
  editor: "nvim"
  sign_commits: true
  rewrite_github_https_to_ssh: false

# 全局功能开关
features:
  # 启用后只使用 1Password SSH Agent，不在磁盘生成长期私钥。
  use_1password: false
  use_starship: true
  use_atuin: true
