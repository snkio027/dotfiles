schema_version = 1

[profiles.core]
description = "跨平台开发基座；仅包含语言、构建、配置和编辑器核心工具"
automation = "ci"

[profiles.workstation]
description = "完整个人工作站；包含 core、交互式 CLI、质量工具及 macOS GUI/字体"
automation = "manual-boundary"
boundary = "CLI 可自动安装；1Password、OrbStack、GUI、字体及授权 MonoLisa 需要真实 macOS 主机或人工验证"

[profiles.devcontainer]
description = "完整非 root Dev Container；保持 Linux 工作站 CLI 与语言工具集合"
automation = "ci"

[profiles.quality]
description = "GitHub Actions 使用的最小验证工具链"
automation = "ci"

# 每个工具只在这里声明一次 owner。profiles 决定它进入哪些可安装快照；
# conditions 只描述特定 profile 的平台条件（all/mac/linux）。

