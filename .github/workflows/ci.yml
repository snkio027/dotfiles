name: DevSecOps Platform CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Dotfiles, Templates & Platform Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Install validation toolchain
        run: |
          brew update
          brew bundle --file=.github/Brewfile

      - name: Check for AppleDouble (._*) metadata pollution
        run: |
          FOUND_APPLEDOUBLE=$(find . -name "._*" | wc -l)
          if [ "$FOUND_APPLEDOUBLE" -gt 0 ]; then
            echo "❌ Error: Found $FOUND_APPLEDOUBLE AppleDouble (._*) files in repository!"
            find . -name "._*"
            exit 1
          fi
          echo "✅ Zero AppleDouble files found."

      - name: Configure chezmoi fixture
        env:
          CHEZMOI_PROFILE: workstation
          GIT_AUTHOR_NAME: CI Test User
          GIT_AUTHOR_EMAIL: ci@example.com
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE"

      - name: Validate workflow and repository security
        run: |
          actionlint
          zizmor .github/workflows/ci.yml
          gitleaks dir --redact --no-banner .

      - name: Validate Shell templates
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          for template in home/dot_zshenv.tmpl home/dot_zprofile.tmpl home/dot_zshrc.tmpl home/dot_config/zsh/exports.zsh.tmpl; do
            rendered="$tmp_dir/$(basename "${template%.tmpl}")"
            chezmoi execute-template --source=. < "$template" > "$rendered"
            zsh -n "$rendered"
          done

          # The inner zsh must evaluate these parameter-existence expressions.
          # shellcheck disable=SC2016
          env \
            RUSTFLAGS=poison ZIG_FLAGS=poison \
            CFLAGS=poison CXXFLAGS=poison \
            UV_PYTHON_PREFERENCE=poison ZVM_INSTALL=poison \
            zsh -fc '
              source "$1"
              (( ! ${+RUSTFLAGS} &&
                 ! ${+ZIG_FLAGS} &&
                 ! ${+CFLAGS} &&
                 ! ${+CXXFLAGS} &&
                 ! ${+UV_PYTHON_PREFERENCE} &&
                 ! ${+ZVM_INSTALL} ))
            ' _ "$tmp_dir/exports.zsh"

          chezmoi execute-template --source=. < home/dot_config/zsh/scripts/executable_doctor.sh.tmpl > "$tmp_dir/doctor.sh"
          bash -n "$tmp_dir/doctor.sh"
          shellcheck -S warning -s bash "$tmp_dir/doctor.sh"

          for script in home/.chezmoiscripts/*.tmpl; do
            rendered="$tmp_dir/$(basename "${script%.tmpl}")"
            chezmoi execute-template --source=. < "$script" > "$rendered"
            bash -n "$rendered"
            shellcheck -S warning -s bash "$rendered"
            shfmt -d -i 4 -ci "$rendered"
          done

      - name: Test Zsh behavior
        run: |
          zsh -f tests/zsh/aliases_test.zsh
          zsh -f tests/zsh/history_test.zsh

      - name: Run chezmoi doctor
        continue-on-error: true
        run: chezmoi doctor

      - name: Test chezmoi template rendering
        run: |
          chezmoi execute-template --source=. < home/dot_config/git/config.tmpl > /dev/null
          chezmoi execute-template --source=. < home/dot_zshenv.tmpl > /dev/null
          chezmoi execute-template --source=. < home/dot_zprofile.tmpl > /dev/null
          chezmoi execute-template --source=. < home/dot_zshrc.tmpl > /dev/null
          chezmoi execute-template --source=. < home/private_dot_ssh/private_config.tmpl > /dev/null
          chezmoi execute-template --source=. < home/private_dot_ssh/private_allowed_signers.tmpl > /dev/null
          chezmoi execute-template --source=. < home/dot_config/zsh/exports.zsh.tmpl > /dev/null
          echo "✅ Template rendering validation successful."

      - name: Validate static configuration
        run: |
          python3 tests/fonts/test_monolisa_manifest.py
          python3 icons/generate.py --check
          python3 tests/icons/test_icon_contract.py
          find . -path ./.git -prune -o -type f -name '*.json' -print0 | xargs -0 -n1 jq empty
          find . -path ./.git -prune -o -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | xargs -0 -n1 ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))'
          find home/dot_config .github -type f -name '*.toml' -print0 | xargs -0 taplo format --check
          stylua --check home/dot_config/nvim tests/nvim
          hadolint --failure-threshold error .devcontainer/Dockerfile

          YAZI_CONFIG_HOME="$PWD/home/dot_config/yazi" yazi --help > /dev/null
          lazygit --use-config-file="$PWD/home/dot_config/lazygit/config.yml" --version
          STARSHIP_CONFIG="$PWD/home/dot_config/starship.toml" starship print-config > /dev/null
          zellij --config "$PWD/home/dot_config/zellij/config.kdl" setup --check

      - name: Validate latest cxx-init release
        run: |
          uv tool install --upgrade --no-config cxx-init
          cxx_bin="$(uv tool dir --bin)/cxx"
          "$cxx_bin" --version
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cd "$tmp_dir"
          "$cxx_bin" init smoke-project --no-git
          cd smoke-project
          cmake --workflow --preset dev

      - name: Test chezmoi apply --dry-run
        run: |
          chezmoi apply --dry-run --source=.
          echo "✅ Dry-run validation passed."

  macos-smoke:
    name: Validate macOS Rendering & Terminal Configuration
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Install validation toolchain
        run: |
          brew update
          brew bundle --file=.github/Brewfile

      - name: Configure chezmoi fixture
        env:
          CHEZMOI_PROFILE: workstation
          GIT_AUTHOR_NAME: CI Test User
          GIT_AUTHOR_EMAIL: ci@example.com
        run: chezmoi init --source="$GITHUB_WORKSPACE"

      - name: Validate macOS templates and Ghostty
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          chezmoi execute-template --source=. < home/dot_config/zsh/exports.zsh.tmpl > "$tmp_dir/exports.zsh"
          zsh -n "$tmp_dir/exports.zsh"
          /Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config \
            --config-file="$PWD/home/dot_config/ghostty/config"
          python3 tests/icons/test_icon_contract.py --font-check
          chezmoi apply --dry-run --source=.

  devcontainer-build:
    name: Build Dev Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --file=.devcontainer/Dockerfile --tag=dotfiles-devcontainer:ci .

  neovim-cold-start:
    name: Validate Rolling-Latest Neovim Environment
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Install validation toolchain
        run: |
          brew update
          brew bundle --file=.github/Brewfile

      - name: Update plugins and tools from empty data directories
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/home/dot_config
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_STATE_HOME: ${{ runner.temp }}/xdg-state
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          nvim --headless "+Lazy! sync" +qa
          nvim --headless "+MasonToolsUpdateSync" +qa
          nvim --headless "+luafile tests/nvim/smoke.lua" +qa
          python3 tests/icons/test_icon_contract.py --drift
          nvim --headless "+luafile tests/nvim/icon_drift.lua" +qa
          if ! git diff --exit-code -- home/dot_config/nvim/lazy-lock.json; then
            echo "::error::Neovim plugins have newer validated commits; run devup and commit lazy-lock.json."
            exit 1
          fi
