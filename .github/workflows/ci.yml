name: DevSecOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Dotfiles, Templates & Platform Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for AppleDouble (._*) metadata pollution
        run: |
          FOUND_APPLEDOUBLE=$(find . -name "._*" | wc -l)
          if [ "$FOUND_APPLEDOUBLE" -gt 0 ]; then
            echo "❌ Error: Found $FOUND_APPLEDOUBLE AppleDouble (._*) files in repository!"
            find . -name "._*"
            exit 1
          fi
          echo "✅ Zero AppleDouble files found."

      - name: Validate Shell Script Syntax (doctor.sh)
        run: |
          bash -n dot_config/zsh/scripts/doctor.sh
          echo "✅ Platform health script syntax valid."

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run chezmoi doctor
        run: chezmoi doctor || true

      - name: Test chezmoi template rendering
        run: |
          mkdir -p ~/.config/chezmoi
          cat << 'EOF' > ~/.config/chezmoi/chezmoi.toml
          [data]
              name = "CI Test User"
              email = "ci@example.com"
              is_mac = false
              is_linux = true
              is_arm64 = false
              op_ssh_sign = "/opt/1Password/op-ssh-sign"
              op_ssh_socket = "~/.1password/agent.sock"
              features.use_1password = true
              features.use_zinit = true
              features.use_starship = true
              features.use_atuin = true
              git.gpg_format = "ssh"
              git.default_branch = "main"
              git.editor = "nvim"
          EOF
          chezmoi execute-template < dot_gitconfig.tmpl > /dev/null
          chezmoi execute-template < dot_zshrc.tmpl > /dev/null
          chezmoi execute-template < private_dot_ssh/private_config.tmpl > /dev/null
          chezmoi execute-template < dot_config/zsh/exports.zsh.tmpl > /dev/null
          chezmoi execute-template < dot_config/mise/config.toml.tmpl > /dev/null
          echo "✅ Template rendering validation successful."

      - name: Test chezmoi apply --dry-run
        run: |
          chezmoi apply --dry-run --source=. || true
          echo "✅ Dry-run validation passed."
