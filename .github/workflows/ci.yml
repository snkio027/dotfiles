name: DevSecOps Platform CI

permissions:
  contents: read

concurrency:
  # Required change validation must not cancel longer schedule/manual maintenance.
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'maintenance' || 'change-validation' }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

jobs:
  classify_pr:
    name: Classify Pull Request Paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.classify.outputs.macos }}
      devcontainer_build: ${{ steps.classify.outputs.devcontainer_build }}
      brew_core: ${{ steps.classify.outputs.brew_core }}
      devcontainer_lifecycle: ${{ steps.classify.outputs.devcontainer_lifecycle }}
      neovim_locked: ${{ steps.classify.outputs.neovim_locked }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/classify_pr_paths.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Dotfiles, Templates & Platform Scripts
    needs: classify_pr
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Install validation toolchain
        run: |
          brew bundle --file=brew/profiles/quality.Brewfile
          bash tests/brew/profile_smoke.sh quality

      - name: Check for AppleDouble (._*) metadata pollution
        run: |
          FOUND_APPLEDOUBLE=$(find . -name "._*" | wc -l)
          if [ "$FOUND_APPLEDOUBLE" -gt 0 ]; then
            echo "❌ Error: Found $FOUND_APPLEDOUBLE AppleDouble (._*) files in repository!"
            find . -name "._*"
            exit 1
          fi
          echo "✅ Zero AppleDouble files found."

      - name: Configure chezmoi fixture
        env:
          CHEZMOI_PROFILE: workstation
          GIT_AUTHOR_NAME: CI Test User
          GIT_AUTHOR_EMAIL: ci@example.com
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE"

      - name: Validate workflow and repository security
        run: |
          actionlint
          zizmor .github/workflows/ci.yml
          gitleaks dir --redact --no-banner .

      - name: Validate Shell templates
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          for template in home/dot_zshenv.tmpl home/dot_zprofile.tmpl home/dot_zshrc.tmpl home/dot_config/zsh/homebrew.zsh.tmpl home/dot_config/zsh/exports.zsh.tmpl; do
            rendered="$tmp_dir/$(basename "${template%.tmpl}")"
            chezmoi execute-template --source=. < "$template" > "$rendered"
            zsh -n "$rendered"
          done

          # The inner zsh must evaluate these parameter-existence expressions.
          # shellcheck disable=SC2016
          env \
            RUSTFLAGS=poison ZIG_FLAGS=poison \
            CFLAGS=poison CXXFLAGS=poison \
            UV_PYTHON_PREFERENCE=poison ZVM_INSTALL=poison \
            zsh -fc '
              source "$1"
              (( ! ${+RUSTFLAGS} &&
                 ! ${+ZIG_FLAGS} &&
                 ! ${+CFLAGS} &&
                 ! ${+CXXFLAGS} &&
                 ! ${+UV_PYTHON_PREFERENCE} &&
                 ! ${+ZVM_INSTALL} ))
            ' _ "$tmp_dir/exports.zsh"

          chezmoi execute-template --source=. < home/dot_config/zsh/scripts/executable_doctor.sh.tmpl > "$tmp_dir/doctor.sh"
          bash -n "$tmp_dir/doctor.sh"
          shellcheck -S warning -s bash "$tmp_dir/doctor.sh"

          for script in home/.chezmoiscripts/*.tmpl; do
            rendered="$tmp_dir/$(basename "${script%.tmpl}")"
            chezmoi execute-template --source=. < "$script" > "$rendered"
            bash -n "$rendered"
            shellcheck -S warning -s bash "$rendered"
            shfmt -d -i 4 -ci "$rendered"
          done

          shellcheck -S warning -s bash tests/nvim/cold_start.sh
          shfmt -d -i 4 -ci tests/nvim/cold_start.sh
          shellcheck -S warning -s bash tests/zsh/linux_homebrew_test.sh
          shfmt -d -i 4 -ci tests/zsh/linux_homebrew_test.sh
          shellcheck -S warning -s bash .devcontainer/install-chezmoi.sh .devcontainer/post-create.sh .devcontainer/provision-nvim.sh tests/devcontainer/lifecycle_smoke.sh tests/devcontainer/provisioning_contract_test.sh
          shfmt -d -i 4 -ci .devcontainer/install-chezmoi.sh .devcontainer/post-create.sh .devcontainer/provision-nvim.sh tests/devcontainer/lifecycle_smoke.sh tests/devcontainer/provisioning_contract_test.sh
          shellcheck -S warning -s bash tests/brew/profile_smoke.sh
          shfmt -d -i 4 -ci tests/brew/profile_smoke.sh
          shellcheck -S warning -s bash tests/git/sweep_test.sh
          shfmt -d -i 4 -ci tests/git/sweep_test.sh
          shellcheck -S warning -s bash scripts/supply-chain/*.sh tests/supply-chain/*.sh
          shfmt -d -i 4 -ci scripts/supply-chain/*.sh tests/supply-chain/*.sh

      - name: Test Shell and apply behavior
        run: |
          bash tests/devcontainer/provisioning_contract_test.sh
          zsh -f tests/zsh/aliases_test.zsh
          zsh -f tests/zsh/history_test.zsh
          bash tests/zsh/linux_homebrew_test.sh
          bash tests/chezmoi/apply_contract_test.sh
          bash tests/git/sweep_test.sh
          bash tests/supply-chain/chezmoi_bootstrap_test.sh
          bash tests/supply-chain/brew_vulnerabilities_test.sh

      - name: Run chezmoi doctor
        continue-on-error: true
        run: chezmoi doctor

      - name: Test chezmoi template rendering
        run: |
          chezmoi execute-template --source=. < home/dot_config/git/config.tmpl > /dev/null
          chezmoi execute-template --source=. < home/dot_zshenv.tmpl > /dev/null
          chezmoi execute-template --source=. < home/dot_zprofile.tmpl > /dev/null
          chezmoi execute-template --source=. < home/dot_zshrc.tmpl > /dev/null
          chezmoi execute-template --source=. < home/dot_config/zsh/homebrew.zsh.tmpl > /dev/null
          chezmoi execute-template --source=. < home/private_dot_ssh/private_config.tmpl > /dev/null
          chezmoi execute-template --source=. < home/private_dot_ssh/private_allowed_signers.tmpl > /dev/null
          chezmoi execute-template --source=. < home/dot_config/zsh/exports.zsh.tmpl > /dev/null
          echo "✅ Template rendering validation successful."

      - name: Validate static configuration
        run: |
          python3 tests/ci/test_install_cost_contract.py
          python3 tests/ci/test_pr_path_classifier.py
          python3 tests/fonts/test_monolisa_manifest.py
          python3 brew/generate.py --check
          python3 tests/brew/test_profiles.py
          python3 tests/supply-chain/test_provenance_contract.py
          python3 icons/generate.py --check
          python3 tests/icons/test_icon_contract.py
          find . -path ./.git -prune -o -type f -name '*.json' -print0 | xargs -0 -n1 jq empty
          find . -path ./.git -prune -o -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | xargs -0 -n1 ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))'
          find home/dot_config .github brew -type f -name '*.toml' -print0 | xargs -0 taplo format --check
          stylua --check home/dot_config/nvim tests/nvim
          nvim -u NONE -i NONE --headless "+set rtp^=$PWD/home/dot_config/nvim" "+luafile tests/nvim/color_unit_contract.lua" +qa
          hadolint --failure-threshold error .devcontainer/Dockerfile

          yazi_version="$(yazi --version)"
          [[ "$yazi_version" =~ ^Yazi([[:space:]]|$) ]]
          lazygit --use-config-file="$PWD/home/dot_config/lazygit/config.yml" --version
          STARSHIP_CONFIG="$PWD/home/dot_config/starship.toml" starship print-config > /dev/null
          zellij --config "$PWD/home/dot_config/zellij/config.kdl" setup --check

      - name: Validate latest cxx-init release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          uv tool install --upgrade --no-config cxx-init
          cxx_bin="$(uv tool dir --bin)/cxx"
          "$cxx_bin" --version
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cd "$tmp_dir"
          "$cxx_bin" init smoke-project --no-git
          cd smoke-project
          cmake --workflow --preset dev

      - name: Test chezmoi apply --dry-run
        run: |
          chezmoi apply --dry-run --source=.
          echo "✅ Dry-run validation passed."

  supply-chain-provenance:
    name: Verify Upstream Supply-chain Provenance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ephemeral Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Verify signed chezmoi bootstrap provenance
        run: bash scripts/supply-chain/verify-chezmoi-release.sh

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Query high-severity formula vulnerabilities
        run: |
          brew tap hashicorp/tap
          bash scripts/supply-chain/check-brew-vulnerabilities.sh \
            brew/profiles/quality.Brewfile \
            brew/profiles/devcontainer.Brewfile

  macos-smoke:
    name: Validate macOS Rendering & Terminal Configuration
    needs: classify_pr
    if: >-
      always() && !cancelled() &&
      (
        github.event_name != 'pull_request' ||
        needs.classify_pr.result != 'success' ||
        format('lane:{0}', needs.classify_pr.outputs.macos) != 'lane:0'
      )
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Install validation toolchain
        run: |
          brew bundle --file=brew/profiles/quality.Brewfile
          bash tests/brew/profile_smoke.sh quality

      - name: Configure chezmoi fixture
        env:
          CHEZMOI_PROFILE: workstation
          GIT_AUTHOR_NAME: CI Test User
          GIT_AUTHOR_EMAIL: ci@example.com
        run: chezmoi init --source="$GITHUB_WORKSPACE"

      - name: Validate macOS templates and Ghostty
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          chezmoi execute-template --source=. < home/dot_config/zsh/exports.zsh.tmpl > "$tmp_dir/exports.zsh"
          zsh -n "$tmp_dir/exports.zsh"
          /Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config \
            --config-file="$PWD/home/dot_config/ghostty/config"
          python3 tests/icons/test_icon_contract.py --font-check
          chezmoi apply --dry-run --source=.

  devcontainer-build:
    name: Build Dev Container
    needs: classify_pr
    if: >-
      always() && !cancelled() &&
      (
        github.event_name != 'pull_request' ||
        needs.classify_pr.result != 'success' ||
        format('lane:{0}', needs.classify_pr.outputs.devcontainer_build) != 'lane:0'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable multi-platform base image
        run: bash scripts/supply-chain/verify-base-image.sh

      - name: Build image
        run: docker build --file=.devcontainer/Dockerfile --tag=dotfiles-devcontainer:ci .

  brew-core-profile:
    name: Install & Exercise Core Brew Profile
    needs: classify_pr
    if: >-
      always() && !cancelled() &&
      (
        github.event_name != 'pull_request' ||
        needs.classify_pr.result != 'success' ||
        format('lane:{0}', needs.classify_pr.outputs.brew_core) != 'lane:0'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Install and exercise the core profile
        run: |
          brew bundle --file=brew/profiles/core.Brewfile
          brew bundle check --file=brew/profiles/core.Brewfile
          bash tests/brew/profile_smoke.sh core

  devcontainer-lifecycle:
    name: Validate Dev Container Lifecycle
    needs: classify_pr
    if: >-
      always() && !cancelled() &&
      (
        github.event_name != 'pull_request' ||
        needs.classify_pr.result != 'success' ||
        format('lane:{0}', needs.classify_pr.outputs.devcontainer_lifecycle) != 'lane:0'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Install lifecycle validation toolchain
        run: |
          brew install devcontainer
          devcontainer --version

      - name: Run full lifecycle twice
        run: bash tests/devcontainer/lifecycle_smoke.sh

  neovim-locked-cold-start:
    name: Validate Locked Neovim Cold Start
    needs: classify_pr
    if: >-
      always() && !cancelled() &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          (
            needs.classify_pr.result != 'success' ||
            format('lane:{0}', needs.classify_pr.outputs.neovim_locked) != 'lane:0'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Install validation toolchain
        run: |
          brew bundle --file=brew/profiles/quality.Brewfile

      - name: Restore locked plugins and provision missing Mason tools
        run: bash tests/nvim/cold_start.sh

  neovim-cold-start:
    name: Validate Rolling-Latest Neovim Environment
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf # main 2026-08-12

      - name: Install validation toolchain
        run: |
          brew bundle --file=brew/profiles/quality.Brewfile

      - name: Update plugins and tools from empty data directories
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/home/dot_config
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_STATE_HOME: ${{ runner.temp }}/xdg-state
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          rolling_log="$RUNNER_TEMP/neovim-rolling.log"
          {
            nvim --headless "+Lazy! sync" "+luafile tests/nvim/provision.lua" +qa
            nvim --headless "+MasonToolsUpdateSync" +qa
            nvim --headless "+luafile tests/nvim/smoke.lua" +qa
            nvim --headless "+luafile tests/nvim/color_contract.lua" +qa
          } 2>&1 | tee "$rolling_log"
          if grep -Fqi 'Package is already installing' "$rolling_log"; then
            echo "::error::Concurrent Mason installation detected."
            exit 1
          fi
          python3 tests/icons/test_icon_contract.py --drift
          nvim --headless "+luafile tests/nvim/icon_drift.lua" +qa
          if ! git diff --exit-code -- home/dot_config/nvim/lazy-lock.json; then
            echo "::error::Neovim plugins have newer validated commits; run devup and commit lazy-lock.json."
            exit 1
          fi
